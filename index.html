<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Karen ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Poppins,sans-serif;
background:#000;
color:white;
overflow-x:hidden;

}

section{

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:40px;

}

.hero{

background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),
url("https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=1400&q=80");

background-size:cover;
background-position:center;
text-align:center;

}

.hero h1{

font-size:65px;
font-family:'Great Vibes',cursive;
margin-bottom:20px;

}

.hero p{

font-size:22px;
max-width:700px;
line-height:1.8;

}

button{

margin-top:40px;
padding:18px 40px;
font-size:18px;
border:none;
border-radius:40px;
background:#ff4d88;
color:white;
cursor:pointer;

}

button:hover{

transform:scale(1.05);

}<!-- ========================= -->
<!-- HISTORIA DE NOSOTROS -->
<!-- ========================= -->

<section id="historia" class="section">
    <h2>Nuestra Historia ❤️</h2>

    <div class="timeline">

        <div class="card">
            <h3>✨ El comienzo</h3>
            <p>
                Desde el momento en que llegaste a mi vida,
                algo cambió para siempre. Poco a poco te convertiste
                en mi lugar favorito, en esa persona con quien quiero
                compartir mis alegrías, mis sueños y cada uno de mis días.
            </p>
        </div>

        <div class="card">
            <h3>📸 Nuestros recuerdos</h3>
            <p>
                Cada fotografía guarda un instante que nunca quiero olvidar.
                Son pequeños pedazos de nuestra historia que me recuerdan
                lo feliz que soy cuando estoy contigo.
            </p>
        </div>

        <div class="card">
            <h3>💖 Lo que siento por ti</h3>
            <p>
                No existe un solo día en el que no piense en ti.
                Eres mi paz, mi felicidad y la persona que quiero seguir
                eligiendo una y otra vez.
            </p>
        </div>

    </div>
</section>

<section id="galeria" class="section">
    <h2>Nuestras Fotos 📷</h2>

    <div class="gallery">

        <img src="foto1.jpg" alt="">
        <img src="foto2.jpg" alt="">
        <img src="foto3.jpg" alt="">
        <img src="foto4.jpg" alt="">
        <img src="foto5.jpg" alt="">
        <img src="foto6.jpg" alt="">

    </div>
</section>
<!-- ========================= -->
<!-- CARTA -->
<!-- ========================= -->

<section id="carta" class="section">

    <h2>Una carta para ti 💌</h2>

    <div class="letter">

        <p>
            Mi amor:
        </p>

        <p>
            Si estás leyendo esto es porque quería encontrar una forma diferente de hablarte desde el corazón.
            A veces las palabras se quedan cortas cuando intento decirte todo lo que significas para mí, pero hoy quiero intentarlo.
        </p>

        <p>
            Gracias por cada sonrisa, cada abrazo, cada momento bonito y cada recuerdo que hemos construido juntos.
            Eres una de las personas más importantes de mi vida y jamás dejaré de agradecer que nuestros caminos se hayan encontrado.
        </p>

        <p>
            También quiero pedirte perdón por todas esas veces en las que te hice sentir mal, por mis errores, por mis actitudes o por las cosas que pudieron lastimarte.
            Nunca fue mi intención hacerte daño y me duele saber que en algún momento pude causarte tristeza.
        </p>

        <p>
            Lo único que deseo es que nuestra relación funcione, que mejore desde el mismo instante en que leas estas palabras.
            Quiero que volvamos a sonreír como antes, que recuperemos esa tranquilidad, esa confianza y ese amor tan bonito que siempre nos ha unido.
        </p>

        <p>
            Porque para mí tú vales la pena.
            Siempre voy a elegir luchar por nosotros, aprender de mis errores y demostrarte con hechos cuánto te amo.
        </p>

        <p>
            Ojalá esta página sea el comienzo de una nueva etapa, una etapa llena de comprensión, cariño, paciencia, risas y muchísimos momentos inolvidables.
        </p>

        <p>
            Te amo con todo mi corazón.
            Gracias por existir, por permanecer en mi vida y por permitirme seguir soñando contigo.
        </p>

        <p style="text-align:center;font-size:28px;">
            ❤️ Te amo infinitamente ❤️
        </p>

    </div>

</section>
